<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Aventura Pixel - plataformas</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10172c;color:#fff;font-family:system-ui;min-height:100vh;display:grid;place-items:center}.wrap{width:min(1100px,100%);padding:10px}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.logo{font-weight:1000;color:#ffe36e;font-size:clamp(17px,3vw,25px);text-shadow:2px 3px #713b9a}.stats{display:flex;gap:6px;flex-wrap:wrap}.pill{background:#1d2b4c;border:2px solid #526b98;border-radius:9px;padding:6px 10px;font-size:13px;font-weight:800}.stage{position:relative;border:4px solid #f4dfa1;border-radius:12px;overflow:hidden;box-shadow:0 12px 40px #0009}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#091329c9;padding:15px;text-align:center}.panel{background:#1b2b4b;border:3px solid #ffdf65;border-radius:17px;padding:22px;max-width:500px;box-shadow:0 8px #0a1225}.panel h1{margin:0 0 8px;color:#ffdf65;font-size:clamp(25px,5vw,40px)}.panel p{line-height:1.5;margin:8px 0 16px}.btn{background:#ffbf3d;color:#39220a;border:0;border-radius:10px;padding:12px 24px;font-size:17px;font-weight:1000;box-shadow:0 4px #a76520;cursor:pointer}.hint{text-align:center;color:#c4d4f0;font-size:12px;margin:8px}.mobile{display:none;justify-content:space-between;margin-top:10px;touch-action:none}.pad{display:flex;gap:8px}.touch{width:58px;height:52px;border-radius:12px;border:2px solid #7188b6;background:#1b2e50;color:white;font-size:23px;font-weight:900;touch-action:none}.jump{width:85px;background:#8247c9}@media(max-width:700px),(pointer:coarse){.mobile{display:flex}.wrap{padding:5px}.pill{padding:5px 7px;font-size:11px}.hint{font-size:11px}}
</style></head><body><div class="wrap">
<div class="top"><div class="logo">⭐ AVENTURA PIXEL</div><div class="stats"><div class="pill">MUNDO <span id="world">1</span>/5</div><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">❤️ <span id="lives">3</span></div><div class="pill">🔊 <button id="sound" style="background:none;border:0;color:white;font-weight:900;cursor:pointer">SONIDO: ON</button></div></div></div>
<div class="stage"><canvas id="game" width="960" height="540"></canvas><div class="overlay" id="overlay"><div class="panel"><h1 id="title">¡Comienza la aventura!</h1><p id="message">Cinco mundos, muchos desafíos, monedas, enemigos y secretos. Llega a la bandera de cada mundo. ¡Activá el sonido y empezá!</p><button class="btn" id="start">JUGAR</button></div></div></div>
<div class="mobile"><div class="pad"><button class="touch" data-key="left">◀</button><button class="touch" data-key="right">▶</button></div><button class="touch jump" data-key="jump">⬆ SALTAR</button></div><div class="hint">Mover: ← → o A/D · Saltar: ESPACIO / ↑ / W · Reiniciar: R · Pisá a los enemigos desde arriba</div></div>
<script>
(()=>{const cv=document.getElementById('game'),c=cv.getContext('2d'),W=960,H=540,ground=468;
const $=id=>document.getElementById(id);let keys={},audio=null,musicOn=true,musicTimer=null,musicStep=0,frame=0,world=1,score=0,lives=3,cam=0,running=false,player,plats=[],coins=[],foes=[],checkpoint=0,levelLength=0;
const tunes=[392,440,523,659,587,523,440,330,392,523,587,784,659,587,523,440];
function audioReady(){if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();}if(audio.state==='suspended')audio.resume();if(musicOn&&!musicTimer)musicTimer=setInterval(()=>{if(!running||!musicOn)return;beep(tunes[musicStep++%tunes.length],.12,'triangle',.035);},190);}
function beep(freq,dur=.12,type='square',vol=.06){if(!audio||!musicOn)return;let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur);}
function sfx(kind){if(!audio||!musicOn)return;({coin:()=>{beep(880,.08,'square');setTimeout(()=>beep(1320,.12,'square',.05),65)},jump:()=>beep(260,.13,'square'),stomp:()=>beep(180,.16,'sawtooth'),hurt:()=>beep(110,.35,'sawtooth'),win:()=>[523,659,784,1046].forEach((n,i)=>setTimeout(()=>beep(n,.22,'triangle'),i*130))}[kind]||(()=>{}))();}
$('sound').onclick=()=>{musicOn=!musicOn;$('sound').textContent='SONIDO: '+(musicOn?'ON':'OFF');if(musicOn)audioReady();};
function buildLevel(n){levelLength=3000+n*420;plats=[{x:0,y:ground,w:520,h:100},{x:590,y:ground,w:500,h:100},{x:1160,y:ground,w:520,h:100},{x:1750,y:ground,w:500,h:100},{x:2320,y:ground,w:levelLength-2320,h:100}];let x=260;while(x<levelLength-220){let y=[370,315,355,290,365][Math.floor(x/260)%5];plats.push({x,y,w:110+(Math.floor(x/260)%3)*25,h:18});x+=250+(n%2)*25;}
coins=[];for(let x=130;x<levelLength-100;x+=92){coins.push({x,y:ground-60-(Math.sin(x*.025)*14),got:false});if(Math.floor(x/92)%5===2)coins.push({x:x+24,y:ground-132,got:false});}
foes=[];for(let x=430;x<levelLength-220;x+=390){foes.push({x,y:ground-34,min:x-75,max:x+100,v:(1.1+n*.13)*(foes.length%2?1:-1),alive:true});}
checkpoint=0;player={x:65,y:ground-48,w:32,h:48,vx:0,vy:0,on:false,inv:0,face:1};cam=0;updateUI();}
function updateUI(){$('world').textContent=world;$('coins').textContent=score;$('lives').textContent=lives;}
function rect(x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),w,h);}
function bg(){let g=c.createLinearGradient(0,0,0,H);let skies=[['#5bc6ff','#e0f8ff'],['#ffad70','#ffe4a1'],['#6557a8','#d5a4d9'],['#263e71','#8bc8d9'],['#31294f','#e18c83']][world-1];g.addColorStop(0,skies[0]);g.addColorStop(1,skies[1]);c.fillStyle=g;c.fillRect(0,0,W,H);c.save();c.translate(-cam*.25,0);for(let i=0;i<15;i++){let x=i*310;c.fillStyle=world===3?'#4d4788':'#77c68c';c.beginPath();c.moveTo(x,ground);c.lineTo(x+150,230+(i%3)*45);c.lineTo(x+300,ground);c.fill();}for(let i=0;i<10;i++){let x=i*420+70;c.fillStyle='#fff9';c.beginPath();c.arc(x,100,23,0,7);c.arc(x+28,91,31,0,7);c.arc(x+60,105,21,0,7);c.fill();}c.restore();}
function draw(){bg();for(let p of plats){let x=p.x-cam;if(x+p.w<0||x>W)continue;rect(x,p.y,p.w,p.h,'#98532f');rect(x,p.y,p.w,12,'#55bd4c');rect(x,p.y+12,p.w,5,'#318e42');for(let a=0;a<p.w;a+=40)rect(x+a,p.y+27,3,3,'#d38a4b');}
for(let q of coins)if(!q.got){let x=q.x-cam;if(x>-20&&x<W+20){let y=q.y+Math.sin(frame*.12+q.x)*4;c.fillStyle='#ffbf21';c.beginPath();c.ellipse(x,y,9,13,0,0,7);c.fill();c.strokeStyle='#fff18c';c.lineWidth=3;c.stroke();}}
for(let e of foes)if(e.alive){let x=e.x-cam;if(x>-40&&x<W+40){rect(x-15,e.y+8,30,24,'#a94d36');rect(x-11,e.y+2,22,16,'#df7543');rect(x-8,e.y+8,5,6,'white');rect(x+4,e.y+8,5,6,'white');rect(x-6,e.y+10,3,4,'#18223a');rect(x+6,e.y+10,3,4,'#18223a');rect(x-12,e.y+30,9,5,'#55352e');rect(x+4,e.y+30,9,5,'#55352e');}}
let flag=levelLength-95-cam;rect(flag,ground-155,8,155,'#eee8d0');rect(flag+8,ground-150,65,38,['#ef5261','#5b91ef','#d15bef','#48c9a0','#ffcf38'][world-1]);rect(flag-8,ground,25,8,'#76502d');
let x=player.x-cam,y=player.y;if(!(player.inv>0&&Math.floor(frame/5)%2===0)){rect(x,y,32,48,'#e9b77f');rect(x,y,32,13,'#713caa');rect(x+5,y+14,22,18,'#f4c18b');rect(x+7,y+19,5,6,'white');rect(x+9,y+21,2,3,'#17223b');rect(x+21,y+19,5,6,'white');rect(x+23,y+21,2,3,'#17223b');rect(x+4,y+32,24,8,'#3e6cce');rect(x+2,y+40,11,8,'#4b3029');rect(x+19,y+40,11,8,'#4b3029');}
c.fillStyle='#17233d';c.font='bold 15px system-ui';c.fillText('MUNDO '+world+' · '+Math.floor(player.x/levelLength*100)+'%',18,27);}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function damage(){if(player.inv>0)return;lives--;sfx('hurt');updateUI();if(lives<=0){running=false;show('¡TE QUEDASTE SIN VIDAS!','Llegaste al mundo '+world+' y juntaste '+score+' monedas. ¡Podés intentarlo otra vez!','REINTENTAR');return;}player.x=Math.max(checkpoint,player.x-115);player.y=ground-90;player.vy=-3;player.inv=100;}
function tick(){if(!running)return;frame++;let d=(keys.right?1:0)-(keys.left?1:0);player.vx=d*4.3;if(d)player.face=d;if((keys.jump||keys.up)&&player.on){player.vy=-12.3;player.on=false;sfx('jump');}player.vy=Math.min(player.vy+.62,14);let old=player.y;player.x=Math.max(0,Math.min(levelLength-30,player.x+player.vx));player.y+=player.vy;player.on=false;
for(let p of plats)if(player.x+player.w>p.x&&player.x<p.x+p.w&&old+player.h<=p.y+5&&player.y+player.h>=p.y&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.on=true;}
if(player.y>H+60)damage();
for(let q of coins)if(!q.got&&Math.abs(player.x+16-q.x)<22&&Math.abs(player.y+24-q.y)<29){q.got=true;score++;sfx('coin');updateUI();}
for(let e of foes)if(e.alive){e.x+=e.v;if(e.x<e.min||e.x>e.max)e.v*=-1;if(hit(player,{x:e.x-14,y:e.y+4,w:28,h:30})){if(player.vy>1&&old+player.h<e.y+17){e.alive=false;player.vy=-8;sfx('stomp');score+=3;updateUI();}else damage();}}
if(player.x>checkpoint+650)checkpoint=player.x-60;if(player.inv>0)player.inv--;cam=Math.max(0,Math.min(levelLength-W,player.x-W*.38));
if(player.x>levelLength-140){running=false;sfx('win');if(world<5){show('¡MUNDO '+world+' SUPERADO!','¡Bien! Completaste el mundo '+world+'. Preparáte: el siguiente tiene más desafíos.','SIGUIENTE MUNDO');$('start').onclick=()=>{world++;buildLevel(world);$('overlay').style.display='none';running=true;audioReady();$('start').onclick=startGame;};}else{show('¡GANASTE LA AVENTURA!','¡Completaste los cinco mundos! Monedas conseguidas: '+score+'. ¡Sos un campeón!','JUGAR DE NUEVO');$('start').onclick=()=>{world=1;score=0;lives=3;buildLevel(world);$('overlay').style.display='none';running=true;audioReady();$('start').onclick=startGame;};}}}
function show(t,m,b){$('title').textContent=t;$('message').textContent=m;$('start').textContent=b;$('overlay').style.display='flex';}
function startGame(){if(lives<=0){world=1;score=0;lives=3;buildLevel(world);}audioReady();$('overlay').style.display='none';running=true;}
$('start').onclick=startGame;window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup',' ','w','a','d'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='a')keys.left=true;if(k==='arrowright'||k==='d')keys.right=true;if(k===' '||k==='arrowup'||k==='w')keys.jump=true;if(k==='r'){world=1;score=0;lives=3;buildLevel(world);running=true;$('overlay').style.display='none';audioReady();}});window.addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=false;if(k==='arrowright'||k==='d')keys.right=false;if(k===' '||k==='arrowup'||k==='w')keys.jump=false;});
document.querySelectorAll('.touch').forEach(b=>{let k=b.dataset.key;let on=e=>{e.preventDefault();keys[k]=true;},off=e=>{e.preventDefault();keys[k]=false;};b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,off));});
function loop(){tick();draw();requestAnimationFrame(loop);}buildLevel(1);loop();
})();</script></body></html>
