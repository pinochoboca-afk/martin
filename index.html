<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Reino de Bruma</title><style>
*{box-sizing:border-box}body{margin:0;background:#11182b;color:white;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.wrap{width:min(1120px,100%);padding:10px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}.logo{font-size:clamp(18px,3vw,25px);font-weight:1000;color:#ffe08a;text-shadow:2px 3px #8d4b3c}.stats{display:flex;gap:7px;flex-wrap:wrap}.stat{background:#1d2b49;border:2px solid #52678e;border-radius:9px;padding:6px 10px;font-size:13px;font-weight:850}.stat button{background:none;border:0;color:white;font:inherit;cursor:pointer}.frame{position:relative;overflow:hidden;border:4px solid #f5dfaa;border-radius:12px;box-shadow:0 15px 45px #0009}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated}.screen{position:absolute;inset:0;background:#091329bd;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center}.card{max-width:500px;background:linear-gradient(145deg,#273c60,#14213c);border:3px solid #ffe08a;border-radius:17px;padding:23px;box-shadow:0 9px #091329}.card h1{color:#ffe08a;font-size:clamp(26px,5vw,42px);margin:0 0 8px;text-shadow:2px 3px #8c4d3b}.card p{line-height:1.5}.action{border:0;border-radius:10px;background:linear-gradient(#ffdf71,#f4a933);color:#42280c;font-weight:1000;font-size:17px;padding:12px 27px;box-shadow:0 5px #a85e23;cursor:pointer}.foot{text-align:center;color:#c3d4ef;font-size:12px;margin:9px}.mobile{display:none;justify-content:space-between;margin-top:10px;touch-action:none}.pad{display:flex;gap:9px}.touch{width:60px;height:54px;border:2px solid #7188b6;border-radius:12px;background:#203556;color:white;font-size:23px;font-weight:900;touch-action:none}.jump{width:92px;background:#754ac2}@media(max-width:700px),(pointer:coarse){.mobile{display:flex}.wrap{padding:5px}.stat{padding:5px 7px;font-size:11px}}
</style></head><body><main class="wrap"><header class="head"><div class="logo">✦ REINO DE BRUMA</div><div class="stats"><div class="stat">MUNDO <span id="world">1</span>-<span id="stage">1</span></div><div class="stat">◆ <span id="gems">0</span></div><div class="stat">♥ <span id="lives">3</span></div><div class="stat"><button id="audioBtn">♫ SONIDO ON</button></div></div></header><div class="frame"><canvas id="game" width="960" height="540"></canvas><div class="screen" id="screen"><div class="card"><h1 id="screenTitle">REINO DE BRUMA</h1><p id="screenText">Una aventura de plataformas: explora bosques, desiertos y castillos, rompe bloques secretos, consigue cristales y vence a los guardianes.</p><button class="action" id="play">COMENZAR</button></div></div></div><div class="mobile"><div class="pad"><button class="touch" data-k="left">◀</button><button class="touch" data-k="right">▶</button></div><button class="touch jump" data-k="jump">⬆ SALTAR</button></div><div class="foot">Mover: ← → / A D · Saltar: ESPACIO / ↑ / W · Pausa: P · Reiniciar: R</div></main>
<script>(()=>{const cv=document.getElementById('game'),g=cv.getContext('2d'),W=960,H=540,GROUND=448,$=id=>document.getElementById(id);let keys={},cam=0,frame=0,world=1,stage=1,gems=0,lives=3,running=false,paused=false,player,solids=[],blocks=[],items=[],enemies=[],goal,boss=null,checkpoint=80,audio=null,sound=true,musicIndex=0;
const tunes=[[392,494,587,494,440,523,659,523,392,494,587,784,659,587,494,440],[330,392,494,392,349,440,523,440,330,392,494,659,587,494,392,349],[294,370,440,370,330,392,494,392,294,370,440,587,523,440,370,330]];
function initAudio(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}
function tone(f,d=.13,type='square',v=.035){if(!audio||!sound)return;let o=audio.createOscillator(),a=audio.createGain();o.type=type;o.frequency.value=f;a.gain.setValueAtTime(v,audio.currentTime);a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(a);a.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}
function fx(n){let a={jump:[330,440],coin:[880,1175],bump:[180],stomp:[145],hurt:[110],power:[523,659,784],win:[523,659,784,1046]}[n]||[];a.forEach((v,i)=>setTimeout(()=>tone(v,.12,n==='hurt'?'sawtooth':'square'),i*80))}
$('audioBtn').onclick=()=>{sound=!sound;$('audioBtn').textContent='♫ SONIDO '+(sound?'ON':'OFF');if(sound)initAudio()};
function solid(x,y,w,h,t='ground'){solids.push({x,y,w,h,t})}function block(x,y,t='question',power=false){blocks.push({x,y,w:42,h:42,t,power,used:false,bump:0})}function enemy(x,fly=false){enemies.push({x,y:fly?330:GROUND-34,w:38,h:fly?30:34,v:1.2+world*.25,min:x-85,max:x+95,fly,alive:true})}
function build(){solids=[];blocks=[];items=[];enemies=[];boss=null;cam=0;checkpoint=80;player={x:70,y:GROUND-52,w:34,h:48,vx:0,vy:0,on:false,face:1,inv:0,power:0,anim:0};let len=4200+(stage-1)*350;window.levelWidth=len;
[[0,820],[920,1670],[1780,2540],[2660,len]].forEach(([x,e])=>solid(x,GROUND,e-x,110));let ps=[[250,354,150],[490,300,140],[1060,355,160],[1320,290,140],[1880,355,150],[2130,292,150],[2770,355,150],[3020,295,150],[3500,350,150]];ps.forEach(([x,y,w])=>solid(x,y,w,18,'platform'));
[620,1460,2290,3210].forEach(x=>solid(x,GROUND-75,58,75,'pillar'));
for(let x=300;x<len-300;x+=420){block(x,world===2?280:318,Math.floor(x/420)%3===1?'brick':'question',Math.floor(x/420)%4===0);if(x%840<20)block(x+42,318,'brick')}
for(let x=540;x<len-300;x+=390)enemy(x,Math.floor(x/390)%4===2);
for(let x=740;x<len-250;x+=670)items.push({x,y:GROUND-55,w:24,h:24,t:'gem',got:false});
goal={x:len-125};if(stage===3)boss={x:len-470,y:GROUND-82,w:70,h:78,hp:5,v:1.2,alive:true};ui()}
function ui(){$('world').textContent=world;$('stage').textContent=stage;$('gems').textContent=gems;$('lives').textContent=lives}
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)}
function background(){let p=[['#68c9f3','#d8f5f7','#4baf87','#29785f'],['#f4a66f','#ffe1a3','#b66d55','#70435a'],['#34385f','#7772a9','#55517d','#292a4b']][world-1],gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,p[0]);gr.addColorStop(1,p[1]);g.fillStyle=gr;g.fillRect(0,0,W,H);g.save();g.translate(-cam*.18,0);for(let i=0;i<14;i++){let x=i*390+80,y=90+i%3*35;g.fillStyle='#ffffffd9';g.beginPath();g.arc(x,y,18,0,7);g.arc(x+24,y-10,25,0,7);g.arc(x+52,y,17,0,7);g.fill()}for(let i=0;i<16;i++){let x=i*330;g.fillStyle=p[2];g.beginPath();g.moveTo(x,GROUND);g.lineTo(x+165,205+i%4*32);g.lineTo(x+330,GROUND);g.fill();g.fillStyle=p[3];g.beginPath();g.moveTo(x+165,205+i%4*32);g.lineTo(x+235,GROUND);g.lineTo(x+330,GROUND);g.fill()}if(world===1)for(let i=0;i<20;i++){let x=i*250+30;rect(x,GROUND-85,18,85,'#347d55');rect(x-13,GROUND-115,44,38,'#3e9b60');rect(x-6,GROUND-135,30,28,'#4caf6e')}if(world===2)for(let i=0;i<12;i++){let x=i*350;rect(x,GROUND-150,95,150,'#9c665a');rect(x+15,GROUND-175,65,30,'#bd8060')}if(world===3)for(let i=0;i<25;i++)rect(i*190,GROUND-110-i%3*25,12,110+i%3*25,'#414166');g.restore()}
function draw(){background();for(let s of solids){let x=s.x-cam;if(x+s.w<0||x>W)continue;if(s.t==='ground'){rect(x,s.y,s.w,s.h,world===1?'#9b5d36':world===2?'#84534b':'#45435e');rect(x,s.y,s.w,13,world===1?'#55b94c':world===2?'#cf9862':'#7771a7');rect(x,s.y+13,s.w,5,'#315d3c');for(let a=0;a<s.w;a+=48)rect(x+a,s.y+33,4,4,'#d99a59')}else if(s.t==='platform'){rect(x,s.y,s.w,s.h,'#a65f39');rect(x,s.y,s.w,8,'#65c65a');for(let a=0;a<s.w;a+=34)rect(x+a,s.y+11,3,3,'#e3a45c')}else{rect(x,s.y,s.w,s.h,'#79533e');rect(x,s.y,s.w,10,'#b57a4a')}}
for(let b of blocks){let x=b.x-cam,y=b.y-(b.bump?Math.sin((5-b.bump)/5*Math.PI)*9:0);if(x<-45||x>W)continue;rect(x,y,42,42,b.t==='question'?(b.used?'#9a7650':'#f3a72e'):'#a95734');rect(x+4,y+4,34,34,b.t==='question'?(b.used?'#b28d5e':'#ffd35c'):'#d27b45');if(b.t==='question'){rect(x+17,y+8,9,20,b.used?'#80674b':'#fff2bb');rect(x+18,y+31,7,5,'#fff2bb')}else{rect(x+19,y+3,4,36,'#a95734');rect(x+3,y+19,36,4,'#a95734')}}
for(let it of items)if(!it.got){let x=it.x-cam,y=it.y+Math.sin(frame*.1+it.x)*5;g.fillStyle='#65fff0';g.beginPath();g.moveTo(x+12,y);g.lineTo(x+23,y+12);g.lineTo(x+12,y+24);g.lineTo(x,y+12);g.closePath();g.fill();g.strokeStyle='white';g.stroke()}
for(let e of enemies)if(e.alive){let x=e.x-cam,y=e.y;rect(x+3,y+8,32,24,e.fly?'#8d4ca4':'#b65b45');rect(x+7,y+1,24,16,'#e28a5d');if(e.fly){rect(x,y+4,13,8,'#f4d9ff');rect(x+25,y+4,13,8,'#f4d9ff')}rect(x+8,y+10,6,7,'white');rect(x+24,y+10,6,7,'white');rect(x+10,y+12,3,4,'#18233a');rect(x+26,y+12,3,4,'#18233a');rect(x+6,y+29,10,5,'#49352e');rect(x+23,y+29,10,5,'#49352e')}
if(boss&&boss.alive){let x=boss.x-cam,y=boss.y;rect(x+8,y+18,55,55,'#59418c');rect(x,y+6,70,30,'#805bb2');rect(x+12,y,15,20,'#f0d8a2');rect(x+44,y,15,20,'#f0d8a2');rect(x+15,y+20,12,12,'white');rect(x+44,y+20,12,12,'white');rect(x+19,y+23,5,7,'#231c36');rect(x+48,y+23,5,7,'#231c36');rect(300,22,360,12,'#251d3a');rect(300,22,360*boss.hp/5,12,'#ef6572');g.fillStyle='white';g.font='bold 14px system-ui';g.fillText('GUARDIÁN',430,17)}
let gx=goal.x-cam;rect(gx,GROUND-150,9,150,'#f6edcf');rect(gx+9,GROUND-146,62,35,['#ef596a','#5b91ef','#d15bef'][world-1]);
let x=player.x-cam,y=player.y;if(!(player.inv>0&&frame%8<4)){rect(x+4,y+4,26,15,'#263a59');rect(x+5,y+8,25,15,'#efb984');rect(x+3,y,28,10,'#e85c43');rect(x+1,y+7,8,8,'#e85c43');rect(x+8,y+20,19,14,'#f0c18c');rect(x+9,y+23,5,6,'white');rect(x+11,y+24,2,4,'#19243a');rect(x+23,y+23,5,6,'white');rect(x+25,y+24,2,4,'#19243a');rect(x+5,y+33,25,11,'#3f72c8');rect(x+4,y+43,11,5,'#53372d');rect(x+20,y+43,12,5,'#53372d');if(player.face<0){g.save();g.translate(2*x+34,0);g.scale(-1,1);/* sprite remains stylized */g.restore()}}
g.fillStyle='#17233d';g.font='bold 15px system-ui';g.fillText(['BOSQUE DE LUZ','DESIERTO ROJO','CASTILLO NOCTURNO'][world-1]+' · '+Math.floor(player.x/window.levelWidth*100)+'%',18,28)}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function blockHit(b){if(b.t==='question'&&!b.used){b.used=true;if(b.power&&!player.power){items.push({x:b.x+10,y:b.y-30,w:22,h:22,t:'power',got:false})}else{gems++;fx('coin');ui()}}else if(b.t==='brick'){blocks.splice(blocks.indexOf(b),1);gems++;ui()}else fx('bump');b.bump=5}
function hurt(){if(player.inv>0)return;lives--;fx('hurt');ui();if(lives<=0){running=false;show('FIN DE LA AVENTURA','Llegaste al mundo '+world+'-'+stage+'. Reuniste '+gems+' cristales.','REINTENTAR');return}player.inv=110;player.vy=-5;player.x=Math.max(checkpoint,player.x-100)}
function update(){if(!running||paused)return;frame++;if(sound&&audio&&frame%13===0){let a=tunes[world-1],n=a[musicIndex++%a.length];tone(n,.17,'triangle',.022);if(musicIndex%4===0)tone(n/2,.2,'sine',.016)}
let d=(keys.right?1:0)-(keys.left?1:0);player.vx=d*4.4;if(d)player.face=d;player.anim+=Math.abs(player.vx)*.08;if((keys.jump||keys.up)&&player.on){player.vy=-13;player.on=false;fx('jump')}
let oldY=player.y;player.vy=Math.min(player.vy+.62,14);player.x=Math.max(0,Math.min(window.levelWidth-player.w,player.x+player.vx));player.y+=player.vy;player.on=false;
for(let s of solids)if(hit(player,s)){if(oldY+player.h<=s.y+7&&player.vy>=0){player.y=s.y-player.h;player.vy=0;player.on=true}}
for(let b of [...blocks]){let r={x:b.x,y:b.y,w:42,h:42};if(hit(player,r)){if(oldY>=b.y+37&&player.vy<0){blockHit(b);player.y=b.y+42;player.vy=1}else if(oldY+player.h<=b.y+8&&player.vy>=0){player.y=b.y-player.h;player.vy=0;player.on=true}}if(b.bump)b.bump--}
for(let it of items)if(!it.got&&hit(player,it)){it.got=true;if(it.t==='power'){player.power=1;player.h=54;player.y-=6;fx('power')}else{gems+=5;fx('coin')}ui()}
for(let e of enemies)if(e.alive){e.x+=e.v;if(e.x<e.min||e.x>e.max)e.v*=-1;if(hit(player,e)){if(player.vy>1&&oldY+player.h<e.y+16){e.alive=false;player.vy=-8;gems+=2;fx('stomp');ui()}else hurt()}}
if(boss&&boss.alive){boss.x+=boss.v;if(boss.x<window.levelWidth-610||boss.x>window.levelWidth-240)boss.v*=-1;if(hit(player,boss)){if(player.vy>1&&oldY+player.h<boss.y+22){boss.hp--;player.vy=-10;fx('stomp');if(boss.hp<=0){boss.alive=false;gems+=20;fx('win');ui()}}else hurt()}}
if(player.y>H+80){player.x=checkpoint;player.y=GROUND-100;player.vy=0;hurt()}if(player.inv>0)player.inv--;if(player.x>checkpoint+650)checkpoint=player.x-80;cam=Math.max(0,Math.min(window.levelWidth-W,player.x-W*.38));
if(player.x>goal.x-35&&(!boss||!boss.alive)){running=false;fx('win');if(stage<3){show('¡ETAPA COMPLETADA!','Superaste el tramo. El siguiente será más difícil.','SIGUIENTE ETAPA');$('play').onclick=()=>{stage++;build();$('screen').style.display='none';running=true;initAudio();$('play').onclick=start}}else if(world<3){show('¡MUNDO CONQUISTADO!','Venciste al guardián. Se abre un nuevo mundo.','SIGUIENTE MUNDO');$('play').onclick=()=>{world++;stage=1;build();$('screen').style.display='none';running=true;initAudio();$('play').onclick=start}}else{show('¡SALVASTE EL REINO!','Completaste los tres mundos y derrotaste a los guardianes.','JUGAR OTRA VEZ');$('play').onclick=()=>{world=1;stage=1;gems=0;lives=3;build();$('screen').style.display='none';running=true;initAudio();$('play').onclick=start}}}}
function show(t,m,b){$('screenTitle').textContent=t;$('screenText').textContent=m;$('play').textContent=b;$('screen').style.display='flex'}
function start(){if(lives<=0){world=1;stage=1;gems=0;lives=3;build()}initAudio();$('screen').style.display='none';running=true;paused=false;$('play').onclick=start}
$('play').onclick=start;window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup',' ','w','a','d'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='a')keys.left=true;if(k==='arrowright'||k==='d')keys.right=true;if(k===' '||k==='arrowup'||k==='w')keys.jump=true;if(k==='p'&&running)paused=!paused;if(k==='r'){world=1;stage=1;gems=0;lives=3;build();running=true;paused=false;$('screen').style.display='none';initAudio()}});window.addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=false;if(k==='arrowright'||k==='d')keys.right=false;if(k===' '||k==='arrowup'||k==='w')keys.jump=false});document.querySelectorAll('.touch').forEach(b=>{let k=b.dataset.k,down=e=>{e.preventDefault();keys[k]=true},up=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',down);['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,up))});function loop(){update();draw();requestAnimationFrame(loop)}build();loop()})();</script></body></html>
