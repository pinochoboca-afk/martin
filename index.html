<body><div id="wrap"><div id="top"><div>🌲 LA CORONA DEL BOSQUE</div><div class="stat">❤️ <span id="lives">3</span>　🪙 <span id="coins">0</span>　⭐ <span id="world">1/3</span></div><div class="stat">⏱ <span id="time">0:00</span>　<button id="pause" class="secondary" style="padding:5px 10px;font-size:12px">Ⅱ</button></div></div>

<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=960,H=540,ui={overlay:document.getElementById('overlay'),panel:document.getElementById('panel'),lives:document.getElementById('lives'),coins:document.getElementById('coins'),world:document.getElementById('world'),time:document.getElementById('time'),pause:document.getElementById('pause')};
const keys={left:false,right:false,jump:false,run:false,fire:false};let state='menu',last=0,cam=0,tick=0,elapsed=0,score=0,lives=3,worldIndex=0,world=null,player=null,particles=[],audio=null,musicTimer=null,musicStep=0,shots=[],notice='',noticeTime=0;
const saved=(()=>{try{return JSON.parse(localStorage.getItem('coronaBosqueSave')||'{}')}catch(e){return {}}})();
const worlds=[
{name:'Bosque Esmeralda',sky:['#65c5df','#d5f0c7'],ground:'#8c6040',grass:'#58a34d',accent:'#e7c45e',length:4100,theme:0},
{name:'Cuevas de Cristal',sky:['#344c82','#9bc4dc'],ground:'#645a70',grass:'#5f9dc1',accent:'#a6f3ed',length:4300,theme:1},
{name:'Fortaleza Volcánica',sky:['#692f45','#e18a59'],ground:'#55404a',grass:'#b45c45',accent:'#ffcf70',length:4500,theme:2}
];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a);
function sound(f=440,d=.1,type='square',v=.035){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}
function startAudio(){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!audio)audio=new A();if(audio.state==='suspended')audio.resume();if(musicTimer)return;const seq=[392,494,587,494,440,523,659,523,392,494,587,784,659,587,494,440,330,392,494,587,523,494,440,392];musicTimer=setInterval(()=>{if(state!=='play')return;let n=seq[musicStep++%seq.length];sound(n,.18,'triangle',.014);if(musicStep%4===0)sound(n/2,.25,'sine',.018)},205)}
function panel(title,body,buttons){ui.panel.innerHTML='<h1>'+title+'</h1>'+body+buttons.map(b=>'<button data-action="'+b.id+'" '+(b.secondary?'class="secondary"':'')+'>'+b.label+'</button>').join('');ui.overlay.style.display='grid';ui.panel.querySelectorAll('button').forEach(b=>b.onclick=()=>actions[b.dataset.action]())}
const actions={start:()=>{startAudio();if(saved.level!==undefined){worldIndex=clamp(saved.level,0,2);score=saved.score||0;lives=saved.lives||3}else{worldIndex=0;score=0;lives=3}loadWorld();state='play';ui.overlay.style.display='none';last=performance.now();requestAnimationFrame(loop)},fresh:()=>{saved.level=0;saved.score=0;localStorage.removeItem('coronaBosqueSave');worldIndex=0;score=0;lives=3;actions.start()},resume:()=>{state='play';ui.overlay.style.display='none';last=performance.now();requestAnimationFrame(loop)},restart:()=>{lives=3;score=0;worldIndex=0;loadWorld();state='play';ui.overlay.style.display='none';last=performance.now();requestAnimationFrame(loop)},next:()=>{worldIndex++;if(worldIndex>=3){panel('¡LEYENDA DEL BOSQUE!','<p>Recuperaste la Corona y liberaste los tres reinos. ¡La aventura queda en tus manos!</p><p>Monedas reunidas: <b>'+score+'</b></p>',[{id:'restart',label:'JUGAR DE NUEVO' }]);return}loadWorld();state='play';ui.overlay.style.display='none';last=performance.now();requestAnimationFrame(loop)}};
function titleScreen(){state='menu';panel('La Corona del Bosque','<p>Una aventura de plataformas clásica: cruzá bosques, cavernas y una fortaleza ardiente. Encontrá secretos, conseguí poderes y vencé a los guardianes.</p><p><b>← →</b> mover · <b>ESPACIO</b> saltar · <b>SHIFT</b> correr · <b>X</b> lanzar fuego</p><p>El progreso se guarda automáticamente en este navegador.</p>',[{id:'start',label:'CONTINUAR AVENTURA'},{id:'fresh',label:'NUEVA PARTIDA',secondary:true}])}
function makeWorld(){
 const w=worlds[worldIndex],o={...w,platforms:[],blocks:[],coins:[],items:[],enemies:[],pits:[],decor:[],checkpoint:100,goal:w.length-150,boss:null};
 // Fixed, hand-placed routes with wide safe landing surfaces and optional upper paths.
 const sets=[
 [[360,365,120],[570,310,115],[920,365,125],[1120,315,120],[1370,360,135],[1690,315,120],[1930,355,125],[2220,300,130],[2510,355,140],[2810,310,125],[3110,360,130],[3410,300,145],[3710,355,130]],
 [[330,355,130],[560,300,130],[860,350,130],[1110,285,130],[1430,350,145],[1730,290,140],[2040,350,130],[2350,285,140],[2660,345,145],[2980,290,135],[3300,350,140],[3650,290,150],[3970,350,130]],
 [[350,355,130],[600,295,135],[900,350,130],[1190,285,130],[1500,350,145],[1810,285,135],[2130,345,135],[2450,285,145],[2780,345,145],[3110,285,145],[3450,350,130],[3770,290,145],[4100,345,130]]
 ];
 o.platforms=sets[worldIndex].map((p,i)=>({x:p[0],y:p[1],w:p[2],h:20,kind:i%3===0?'wood':'stone'}));
 const gaps=worldIndex===0?[[760,870],[1570,1660],[2420,2500],[3290,3370]]:worldIndex===1?[[740,835],[1570,1660],[2480,2560],[3440,3520]]:[[780,870],[1610,1700],[2490,2580],[3400,3490]];
 o.pits=gaps;
 const bx=[480,525,1300,1980,2880,3540],by=[350,350,275,300,260,260];bx.forEach((x,i)=>o.blocks.push({x:x+(worldIndex*13),y:by[i],used:false,type:i%3===0?'question':'brick',prize:i===2?'flower':'coin'}));
 // Coin arcs above platforms and ground routes.
 for(let x=210;x<o.length-220;x+=135){let y=worldIndex===1?330:worldIndex===2?325:340;o.coins.push({x,y:y-(Math.floor(x/135)%3)*22,got:false})}
 o.coins.push(...[[500,300],[540,300],[980,310],[1170,250],[1750,250],[2260,240],[2840,250],[3450,240]].map(p=>({x:p[0],y:p[1],got:false})));
 for(let i=0;i<7;i++){let x=420+i*510;o.enemies.push({x,y:418,vx:i%2?1.15:-1.15,min:x-80,max:x+190,w:34,h:30,alive:true,type:i%2?'slime':'beetle'})}
 if(worldIndex===2){o.boss={x:o.length-490,y:366,w:76,h:78,hp:7,max:7,dir:-1,alive:true,hit:0,fire:0}}
 o.decor=Array.from({length:Math.ceil(o.length/115)},(_,i)=>({x:i*115+rand(-30,30),h:rand(55,110),kind:i%4}));
 return o;
}
function loadWorld(){world=makeWorld();player={x:90,y:390,w:30,h:48,vx:0,vy:0,ground:false,face:1,inv:90,big:false,fire:false,shotCooldown:0};cam=0;particles=[];shots=[];tick=0;ui.world.textContent=(worldIndex+1)+'/3';ui.lives.textContent=lives;ui.coins.textContent=score;save()}
function save(){try{localStorage.setItem('coronaBosqueSave',JSON.stringify({level:worldIndex,score,lives}))}catch(e){}}
function rect(a,b,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(a),Math.round(b),w,h)}
function hit(a,b,w,h,o){return a<o.x+o.w&&a+w>o.x&&b<o.y+o.h&&b+h>o.y}
function pitAt(x,w){return world.pits.some(p=>x+w>p[0]+3&&x<p[1]-3)}
function burst(x,y,color,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-3,3),vy:rand(-6,-1),life:rand(18,38),color,size:rand(3,6)})}
function collect(c){c.got=true;score++;ui.coins.textContent=score;sound(880,.09,'sine',.04);burst(c.x,c.y,'#ffe477',5);if(score%25===0){lives++;ui.lives.textContent=lives;sound(660,.2,'triangle')}}
function hurt(){if(player.inv>0)return;lives--;ui.lives.textContent=lives;sound(110,.3,'sawtooth',.06);if(lives<=0){state='over';save();panel('FIN DE LA PARTIDA','<p>El bosque todavía necesita un héroe. Tu aventura quedó guardada hasta el último mundo alcanzado.</p>',[{id:'restart',label:'VOLVER A INTENTAR'}]);return}player.x=world.checkpoint;player.y=390;player.vx=player.vy=0;player.inv=110;player.fire=false;save()}
function collideSolids(nx,ny,oldY){let p=player; // Horizontal walls
 for(const b of world.blocks)if(hit(nx,p.y,p.w,p.h,{x:b.x,y:b.y,w:38,h:38})){if(p.vx>0)nx=b.x-p.w;else if(p.vx<0)nx=b.x+38;p.vx=0}
 p.x=nx;p.ground=false;
 if(p.vy>=0){let land=null;for(const s of world.platforms)if(p.x+p.w>s.x+2&&p.x<s.x+s.w-2&&oldY+p.h<=s.y+5&&ny+p.h>=s.y)if(land===null||s.y<land)land=s.y;
 if(!pitAt(p.x,p.w)&&oldY+p.h<=448&&ny+p.h>=448)if(land===null||448<land)land=448;
 if(land!==null){ny=land-p.h;p.vy=0;p.ground=true}}
 else{for(const b of world.blocks)if(p.x+p.w>b.x+2&&p.x<b.x+36&&oldY>=b.y+36&&ny<=b.y+38){ny=b.y+38;p.vy=0;if(!b.used){b.used=true;burst(b.x+19,b.y,'#e8ad4d');if(b.prize==='coin'){score++;ui.coins.textContent=score;sound(900,.1)}else{world.items.push({x:b.x+8,y:b.y-5,type:'flower',vy:-2,life:900});sound(550,.18)}}}}
 for(const b of world.blocks)if(p.x+p.w>b.x+1&&p.x<b.x+37&&ny+p.h>b.y+1&&ny<b.y+37){if(p.vy>=0&&oldY+p.h<=b.y+5){ny=b.y-p.h;p.vy=0;p.ground=true}else if(p.vy<0&&oldY>=b.y+33){ny=b.y+38;p.vy=0}}
 p.y=ny;
}
function update(dt){tick+=dt;const p=player,oldY=p.y;let acc=.7,max=keys.run?5.7:4.15;if(keys.left){p.vx-=acc;p.face=-1}if(keys.right){p.vx+=acc;p.face=1}if(!keys.left&&!keys.right)p.vx*=.78;p.vx=clamp(p.vx,-max,max);
 if(keys.jump&&p.ground){p.vy=p.big?-14.5:-13.1;p.ground=false;keys.jump=false;sound(480,.09,'square')}
 p.vy=Math.min(14,p.vy+.62);let nx=clamp(p.x+p.vx,0,world.length-p.w),ny=p.y+p.vy;collideSolids(nx,ny,oldY);
 if(p.y>570){hurt();return}if(p.x>world.checkpoint+340&&world.checkpoint<world.length-800){world.checkpoint=Math.floor(p.x/500)*500;notice='PUNTO DE CONTROL';noticeTime=100;sound(700,.2,'triangle')}
 if(p.inv>0)p.inv--;if(p.shotCooldown>0)p.shotCooldown--;
 world.coins.forEach(c=>{if(!c.got&&Math.abs(p.x+p.w/2-c.x)<26&&Math.abs(p.y+p.h/2-c.y)<36)collect(c)});
 world.items.forEach(it=>{it.y+=it.vy;it.vy+=.12;it.life--;if(hit(p.x,p.y,p.w,p.h,{x:it.x,y:it.y,w:25,h:28})){it.life=0;p.fire=true;p.big=true;notice='PODER DE FUEGO';noticeTime=110;sound(740,.25,'triangle');burst(it.x,it.y,'#ffad48',16)}});world.items=world.items.filter(i=>i.life>0);
 world.enemies.forEach(e=>{if(!e.alive)return;e.x+=e.vx;if(e.x<e.min||e.x+e.w>e.max)e.vx*=-1;if(hit(p.x,p.y,p.w,p.h,e)){if(p.vy>1&&oldY+p.h<e.y+17){e.alive=false;p.vy=-8.5;p.ground=false;score+=2;ui.coins.textContent=score;burst(e.x+15,e.y,'#a6d66c',12);sound(240,.12)}else hurt()}});
 if(world.boss?.alive){let b=world.boss;b.x+=b.dir*.85;if(b.x<world.length-680||b.x>world.length-210)b.dir*=-1;if(b.hit>0)b.hit--;if(++b.fire>145){b.fire=0;shots.push({x:b.x,y:b.y+35,vx:b.dir* -3.2,enemy:true})}if(hit(p.x,p.y,p.w,p.h,b)){if(p.vy>1&&oldY+p.h<b.y+24&&b.hit===0){b.hp--;b.hit=70;p.vy=-10;burst(b.x+35,b.y,'#ffd36b',16);sound(95,.22);if(b.hp<=0){b.alive=false;notice='¡GUARDIÁN DERROTADO!';noticeTime=120}}else if(b.hit===0)hurt()}}
 if(keys.fire&&p.fire&&p.shotCooldown===0){shots.push({x:p.x+p.w/2,y:p.y+22,vx:p.face*7,enemy:false});p.shotCooldown=24;sound(330,.07)}
 shots.forEach(s=>{s.x+=s.vx;if(s.enemy){if(hit(p.x,p.y,p.w,p.h,{x:s.x,y:s.y,w:14,h:14}))hurt()}else{world.enemies.forEach(e=>{if(e.alive&&hit(s.x,s.y,13,13,e)){e.alive=false;s.dead=true;burst(e.x,e.y,'#ffb44d',8)}});if(world.boss?.alive&&hit(s.x,s.y,13,13,world.boss)&&world.boss.hit===0){world.boss.hp--;world.boss.hit=35;s.dead=true;burst(s.x,s.y,'#ffb44d',8)}}if(s.x<cam-80||s.x>cam+W+80)s.dead=true});shots=shots.filter(s=>!s.dead);
 particles.forEach(a=>{a.x+=a.vx;a.y+=a.vy;a.vy+=.16;a.life--});particles=particles.filter(a=>a.life>0);
 cam=clamp(p.x-W*.38,0,world.length-W);if(noticeTime>0)noticeTime--;
 if(p.x>world.goal&&(!world.boss||!world.boss.alive)){state='stageclear';save();panel(worldIndex===2?'¡CORONA RECUPERADA!':'¡MUNDO COMPLETADO!', '<p>'+world.name+' superado.</p><p>Monedas acumuladas: <b>'+score+'</b></p>',[{id:'next',label:worldIndex===2?'VER RESULTADO':'SIGUIENTE MUNDO'}])}
}
function drawBackground(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,world.sky[0]);g.addColorStop(1,world.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(let layer=0;layer<3;layer++){let off=-(cam*(.10+layer*.09))%500;for(let i=-1;i<4;i++){let xx=i*500+off;ctx.fillStyle=world.theme===0?['#9bc9a9','#75aa8a','#548b72'][layer]:world.theme===1?['#637aa4','#52688d','#425675'][layer]:['#9b5c58','#7b454e','#583a4b'][layer];ctx.beginPath();ctx.moveTo(xx,390);ctx.lineTo(xx+130,150+layer*40);ctx.lineTo(xx+270,385);ctx.lineTo(xx+390,185+layer*40);ctx.lineTo(xx+500,390);ctx.fill()}}
 for(let i=0;i<7;i++){let xx=((i*185-tick*.16-cam*.2)%1150+1150)%1150-80,yy=65+i%3*45;ctx.fillStyle='#f4fff0a8';ctx.beginPath();ctx.arc(xx,yy,22,0,7);ctx.arc(xx+25,yy-10,27,0,7);ctx.arc(xx+53,yy,20,0,7);ctx.fill()}
 for(const d of world.decor){let xx=d.x-cam;if(xx<-80||xx>W+80)continue;if(world.theme===1){rect(xx,390-d.h,15,d.h,'#42566b');ctx.fillStyle='#84cbd0';ctx.beginPath();ctx.moveTo(xx-18,390-d.h);ctx.lineTo(xx+7,390-d.h-35);ctx.lineTo(xx+32,390-d.h);ctx.fill()}else{rect(xx,390-d.h*.65,13,d.h*.65,'#76513e');ctx.fillStyle=world.theme===2?'#a94e3f':d.kind%2?'#347b58':'#438c62';ctx.beginPath();ctx.arc(xx+5,370-d.h,35,0,7);ctx.arc(xx-13,382-d.h*.75,24,0,7);ctx.arc(xx+26,382-d.h*.75,24,0,7);ctx.fill()}}
}
function drawGround(){for(let sx=0;sx<world.length;sx+=40){if(world.pits.some(p=>sx+40>p[0]&&sx<p[1]))continue;let xx=sx-cam;if(xx<-45||xx>W+45)continue;rect(xx,448,40,92,world.ground);rect(xx,448,40,10,world.grass);rect(xx,448,40,3,world.accent);for(let k=0;k<3;k++)rect(xx+5+k*13,473+(k%2)*17,6,4,'#493b42')}
 world.pits.forEach(p=>{let xx=p[0]-cam,ww=p[1]-p[0];rect(xx,448,ww,92,'#27394b');rect(xx,480,ww,60,world.theme===2?'#c64e36':'#197da2');for(let k=0;k<ww;k+=20){let wave=Math.sin(tick*.08+k*.1)*4;rect(xx+k,481+wave,13,4,'#a2e8d7')}rect(xx,448,6,92,'#719b70');rect(xx+ww-6,448,6,92,'#719b70')})}
function drawWorld(){drawBackground();drawGround();world.platforms.forEach(s=>{let xx=s.x-cam;if(xx<-150||xx>W+100)return;rect(xx,s.y,s.w,s.h,s.kind==='wood'?'#986342':'#65766d');rect(xx,s.y,s.w,5,s.kind==='wood'?'#d09a59':'#b2d29a');for(let k=0;k<s.w;k+=25)rect(xx+k,s.y+8,2,11,'#46564f')});
 world.blocks.forEach(b=>{let xx=b.x-cam;if(xx<-50||xx>W+50)return;rect(xx,b.y,38,38,b.used?'#857565':b.type==='question'?'#e9a934':'#b66b45');rect(xx+3,b.y+3,32,5,'#ffe28a');rect(xx+5,b.y+11,5,22,'#784b36');rect(xx+28,b.y+11,5,22,'#784b36');if(!b.used)label(b.type==='question'?'?':'▦',xx+11,b.y+28,22,'#fff2c3')});
 world.coins.forEach(c=>{if(c.got)return;let xx=c.x-cam;ctx.fillStyle='#ffdc61';ctx.beginPath();ctx.ellipse(xx,c.y,8,12+Math.sin(tick*.12+c.x)*2,0,0,7);ctx.fill();rect(xx-2,c.y-7,3,14,'#fff3a3')});
 world.items.forEach(it=>{let xx=it.x-cam;ctx.fillStyle='#f5a84b';ctx.beginPath();ctx.arc(xx+12,it.y+12,12,0,7);ctx.fill();rect(xx+9,it.y-1,7,8,'#4eaa65');rect(xx+15,it.y+7,5,5,'#fff1a3')});
 world.enemies.forEach(e=>{if(!e.alive)return;let xx=e.x-cam;ctx.fillStyle=e.type==='slime'?'#d77c5d':'#42694d';ctx.beginPath();ctx.ellipse(xx+17,e.y+18,17,13,0,Math.PI,0);ctx.fill();rect(xx+3,e.y+17,28,10,e.type==='slime'?'#d77c5d':'#6fa05c');rect(xx+9,e.y+10,5,6,'#fff');rect(xx+22,e.y+10,5,6,'#fff');rect(xx+11,e.y+12,3,4,'#27313b');rect(xx+24,e.y+12,3,4,'#27313b')});
 if(world.boss?.alive){let b=world.boss,xx=b.x-cam;if(!(b.hit>0&&tick%8<4)){rect(xx+7,b.y+20,62,54,'#66737b');rect(xx+1,b.y+3,20,28,'#505b66');rect(xx+56,b.y+3,20,28,'#505b66');rect(xx+17,b.y+33,14,8,'#ffcb5c');rect(xx+47,b.y+33,14,8,'#ffcb5c');rect(xx+29,b.y+55,20,5,'#35343d');rect(xx+10,b.y+68,22,10,'#4c5963');rect(xx+51,b.y+68,22,10,'#4c5963')}rect(320,18,320,13,'#253344');rect(320,18,320*b.hp/b.max,13,'#e35c50');label('GUARDIÁN',325,14,12,'#fff0c5')}
 // Finish gate and checkpoint flag
 let gx=world.goal-cam;rect(gx,350,7,98,'#65452e');rect(gx+7,350,55,26,'#f1d99b');label('META',gx+12,369,13,'#513a2b');
 let fx=world.checkpoint-cam;rect(fx,390,5,58,'#60442e');rect(fx+5,391,30,18,'#f7dc78');
 shots.forEach(s=>{let xx=s.x-cam;ctx.fillStyle=s.enemy?'#f06c48':'#ffdf73';ctx.beginPath();ctx.arc(xx,s.y,7,0,7);ctx.fill();rect(xx-2,s.y-2,4,4,'#fff')});
 particles.forEach(a=>rect(a.x-cam,a.y,a.size,a.size,a.color));
 drawPlayer();
 if(noticeTime>0){ctx.fillStyle='#142b3ddd';ctx.fillRect(355,65,250,38);label(notice,370,90,18,'#ffe28a')}
}
function label(t,x,y,size=16,color='#fff'){ctx.font='bold '+size+'px system-ui';ctx.fillStyle='#1c2b35';ctx.fillText(t,x+2,y+2);ctx.fillStyle=color;ctx.fillText(t,x,y)}
function drawPlayer(){let p=player,xx=p.x-cam,yy=p.y;if(p.inv>0&&Math.floor(tick/5)%2===0)return;rect(xx+3,yy+40,11,8,'#563d32');rect(xx+17,yy+40,11,8,'#563d32');rect(xx+5,yy+22,21,20,p.fire?'#ed693d':'#d94c38');rect(xx+7,yy+26,17,14,'#315d9a');rect(xx+7,yy+8,18,16,'#f0b77d');rect(xx+4,yy+13,5,7,'#d99268');rect(xx+21,yy+15,10,6,'#f0b77d');rect(xx+21,yy+11,3,4,'#fff');rect(xx+22,yy+12,2,3,'#26303b');rect(xx+5,yy+5,21,7,'#633d2e');rect(xx+2,yy+4,26,7,p.fire?'#ed9b3f':'#c94536');rect(xx+8,yy,16,6,p.fire?'#ffd36b':'#e65a4b');rect(xx+13,yy+29,4,4,'#f6d27d')}
function draw(){drawWorld()}
function loop(now){if(state!=='play')return;let dt=Math.min(2,(now-last)/16.67||1);last=now;elapsed+=dt/60;update(dt);draw();ui.time.textContent=Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0');if(state==='play')requestAnimationFrame(loop)}
function pause(){if(state!=='play')return;state='paused';panel('PAUSA','<p>La aventura está detenida.</p>',[{id:'resume',label:'SEGUIR JUGANDO'},{id:'restart',label:'REINICIAR PARTIDA',secondary:true}])}
ui.pause.onclick=pause;
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowDown',' ','Shift'].includes(e.key))e.preventDefault();if(e.key==='Escape'||e.key==='p'||e.key==='P'){if(state==='play')pause();else if(state==='paused')actions.resume();return}if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='Shift')keys.run=true;if((e.key===' '||e.key==='ArrowUp'||e.key==='w')&&!keys.jump)keys.jump=true;if(e.key==='x'||e.key==='X')keys.fire=true});
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key==='Shift')keys.run=false;if(e.key===' '||e.key==='ArrowUp'||e.key==='w')keys.jump=false;if(e.key==='x'||e.key==='X')keys.fire=false});
document.querySelectorAll('#touch button').forEach(b=>{let k=b.dataset.key;const on=e=>{e.preventDefault();keys[k]=true},off=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});
draw=()=>{if(world)drawWorld();else{ctx.fillStyle='#7ac8df';ctx.fillRect(0,0,W,H)}};draw();titleScreen();
})();
</script></body></html>
